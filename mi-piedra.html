<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mi Piedra · DuoSpark</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f0fbff;background:#071725}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#071725}.scene{position:relative;min-height:100svh;overflow:hidden;background:#102d3d}.photo{position:absolute;inset:0;background:url('./mi-piedra.jpg') center/cover no-repeat;transform:scale(1.015)}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#07162566 0%,transparent 35%,#06131d9e 100%);pointer-events:none}.night{position:absolute;inset:0;background:#06122a;opacity:0;transition:opacity 2s;pointer-events:none}.scene.is-night .night{opacity:.48}.stars{position:absolute;inset:0;opacity:0;transition:opacity 2s;pointer-events:none}.scene.is-night .stars{opacity:1}.star{position:absolute;width:2px;height:2px;background:white;border-radius:50%;box-shadow:0 0 7px 2px #ffffff9c;animation:twinkle 3s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.3}}.meteor{position:absolute;left:-30%;top:15%;width:115px;height:2px;background:linear-gradient(90deg,transparent,#b9faff);transform:rotate(-19deg);opacity:0;pointer-events:none}.meteor.go{animation:shoot 2.5s ease-out forwards}@keyframes shoot{0%{left:0;top:15%;opacity:0}12%{opacity:1}85%{opacity:1}100%{left:115%;top:55%;opacity:0}}header{position:relative;z-index:2;padding:24px max(20px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:10px}a{color:#d3faff;text-decoration:none;border:1px solid #ffffff78;background:#07172588;border-radius:40px;padding:10px 15px;backdrop-filter:blur(9px)}.intro{position:relative;z-index:2;max-width:660px;margin:10vh auto 0;text-align:center;padding:0 22px;text-shadow:0 2px 12px #061521}h1{font-family:Georgia,serif;font-size:clamp(2.7rem,8vw,5.5rem);font-weight:400;margin:0 0 12px}p{font-size:1.08rem;line-height:1.6}.controls{position:relative;z-index:3;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:30px auto 0;padding:0 16px}.controls button{font:inherit;color:white;border:1px solid #a7eff0a8;background:#08293abf;padding:12px 17px;border-radius:24px;cursor:pointer;backdrop-filter:blur(9px)}.controls button:focus-visible,a:focus-visible{outline:3px solid white}.note{position:relative;z-index:2;text-align:center;font-size:.82rem;color:#e0eef3;margin:20px}.scene.quiet header,.scene.quiet .intro,.scene.quiet .controls,.scene.quiet .note{opacity:0;pointer-events:none}.exit-quiet{position:fixed;z-index:5;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));display:none;border:1px solid #fff8;border-radius:30px;padding:12px 17px;color:white;background:#071725ba;font:inherit}.scene.quiet .exit-quiet{display:block}@media(prefers-reduced-motion:reduce){.star,.meteor{animation:none!important}}
</style></head>
<body><main class="scene" id="scene"><div class="photo" role="img" aria-label="Vista real del Atlántico desde Mi Piedra"></div><div class="night"></div><div class="stars" id="stars"></div><div class="meteor" id="meteor"></div><div class="shade"></div>
<header><a href="./index.html">← Volver a DuoSpark</a><span>🌊 Un refugio atlántico</span></header>
<section class="intro"><h1>Mi Piedra</h1><p>Un lugar donde no hace falta ganar nada.<br>Solo mirar el mar, escuchar las olas y estar aquí.</p></section>
<div class="controls"><button id="nightBtn">🌙 Ver la noche</button><button id="seaBtn">🌊 Escuchar el mar</button><button id="meteorBtn">✨ Una perseida</button><button id="quietBtn">🪨 Solo quiero estar aquí</button></div>
<p class="note">Paisaje: fotografía real desde tu piedra · El sonido es una recreación ambiental, no una grabación de esta playa.</p>
<button class="exit-quiet" id="exitBtn">Mostrar controles</button></main>
<script>
const scene=document.getElementById('scene'),stars=document.getElementById('stars');for(let i=0;i<95;i++){const s=document.createElement('span');s.className='star';s.style.left=((i*73.19)%100)+'%';s.style.top=((i*37.71)%72)+'%';s.style.animationDelay=((i*0.23)%3)+'s';stars.appendChild(s)}
document.getElementById('nightBtn').onclick=()=>{const n=scene.classList.toggle('is-night');document.getElementById('nightBtn').textContent=n?'🌅 Volver al atardecer':'🌙 Ver la noche'};
document.getElementById('meteorBtn').onclick=()=>{scene.classList.add('is-night');document.getElementById('nightBtn').textContent='🌅 Volver al atardecer';const m=document.getElementById('meteor');m.classList.remove('go');void m.offsetWidth;m.classList.add('go')};
document.getElementById('quietBtn').onclick=()=>scene.classList.add('quiet');document.getElementById('exitBtn').onclick=()=>scene.classList.remove('quiet');
let ctx,noise,filter,gain,playing=false;const sea=document.getElementById('seaBtn');
sea.onclick=async()=>{try{if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();const b=ctx.createBuffer(1,ctx.sampleRate*3,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;noise=ctx.createBufferSource();noise.buffer=b;noise.loop=true;filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=550;gain=ctx.createGain();gain.gain.value=.035;noise.connect(filter).connect(gain).connect(ctx.destination);noise.start()}if(playing){await ctx.suspend();playing=false}else{await ctx.resume();playing=true}sea.textContent=playing?'🔇 Silenciar el mar':'🌊 Escuchar el mar'}catch(e){sea.textContent='Audio no disponible'}};
</script></body></html>
